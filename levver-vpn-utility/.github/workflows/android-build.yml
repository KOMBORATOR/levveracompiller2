name: Build LEVVER VPN UTILITY APK
on:
  push:
    branches: [ "levver-vpn-utility" ]
    paths:
      - "levver-vpn-utility/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: levver-vpn-utility
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LEVVER-VPN-UTILITY-debug
          path: levver-vpn-utility/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
