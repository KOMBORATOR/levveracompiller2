name: Build LEVVER VPN UTILITY APK
on:
  push:
    branches: [ "levver-vpn-utility" ]
    paths:
      - "levver-vpn-utility/**"
      - ".github/workflows/levver-vpn-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: levver-vpn-utility
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEVVER-VPN-UTILITY-debug
          path: levver-vpn-utility/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
